<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Squat | Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #0B0B0C;
            --bg-darker: #111214;
            --bg-input: #1E1F22;
            --blurple: #5865F2;
            --text-main: #E0E1E5;
            --text-muted: #949BA4;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', sans-serif; background: var(--bg-black); color: white; overflow: hidden; }
        
        /* --- Écrans d'authentification --- */
        #auth-screen {
            position: fixed; inset: 0; z-index: 100; background: var(--bg-black);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #18191C; padding: 32px; border-radius: 8px; width: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); text-align: center;
        }
        .auth-card h2 { margin-bottom: 24px; }
        .auth-card input {
            width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 4px;
            border: none; background: #0F0F10; color: white; box-sizing: border-box;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--blurple); border: none;
            color: white; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .auth-link { color: var(--blurple); cursor: pointer; font-size: 14px; display: block; margin-top: 15px; }

        /* --- Interface Principale (Masquée au début) --- */
        #main-app { display: none; height: 100vh; }
        .sidebar { width: 240px; background: var(--bg-darker); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .chat-container { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg-black); }
        .header { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #1e1f22; font-weight: bold; }
        
        .messages-list { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { display: flex; gap: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blurple); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .msg-text img { max-width: 300px; border-radius: 8px; margin-top: 10px; display: block; }
        
        .input-bar { padding: 0 20px 24px; }
        .input-wrap { background: var(--bg-input); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; }
        .input-wrap input[type="text"] { background: transparent; border: none; color: white; flex-grow: 1; outline: none; }
        .icon-btn { color: var(--text-muted); cursor: pointer; font-size: 18px; transition: 0.2s; }
        .icon-btn:hover { color: white; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card" id="login-form">
            <h2>Bon retour !</h2>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-pass" placeholder="Mot de passe">
            <button onclick="login()">Se connecter</button>
            <span class="auth-link" onclick="toggleAuth(true)">Besoin d'un compte ? S'inscrire</span>
        </div>
        <div class="auth-card" id="register-form" style="display:none;">
            <h2>Créer un compte</h2>
            <input type="text" id="reg-pseudo" placeholder="Pseudo unique">
            <input type="email" id="reg-email" placeholder="E-mail">
            <input type="password" id="reg-pass" placeholder="Mot de passe">
            <button onclick="register()">S'inscrire</button>
            <span class="auth-link" onclick="toggleAuth(false)">Déjà un compte ?</span>
        </div>
    </div>

    <div id="main-app" class="app-container" style="display:flex;">
        <aside class="sidebar">
            <div class="header">🏠 Squat</div>
            <div style="padding: 20px 10px; color: var(--text-muted); font-size: 12px; font-weight: bold;">SALONS TEXTUELS</div>
            <div style="padding: 10px; background: #35373c22; color: white; margin: 0 8px; border-radius: 4px;"># général</div>
        </aside>

        <main class="chat-container">
            <div class="header"># général</div>
            <div class="messages-list" id="msg-flow"></div>
            <div class="input-bar">
                <div class="input-wrap">
                    <label for="img-upload" class="icon-btn"><i class="fa-solid fa-circle-plus"></i></label>
                    <input type="file" id="img-upload" hidden accept="image/*">
                    <input type="text" id="chat-input" placeholder="Envoyer un message dans #général">
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "TA_CLE",
            authDomain: "TON_DOMAINE",
            projectId: "TON_ID",
            storageBucket: "TON_BUCKET",
            messagingSenderId: "TON_SENDER",
            appId: "TON_APP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUserPseudo = "";

        // --- AUTH LOGIC ---
        window.toggleAuth = (showReg) => {
            document.getElementById('login-form').style.display = showReg ? 'none' : 'block';
            document.getElementById('register-form').style.display = showReg ? 'block' : 'none';
        }

        window.register = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const pseudo = document.getElementById('reg-pseudo').value.trim();

            if(!pseudo) return alert("Pseudo requis");

            // Vérifier si le pseudo existe déjà
            const userDoc = await getDoc(doc(db, "pseudos", pseudo));
            if(userDoc.exists()) return alert("Ce pseudo est déjà pris !");

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), { pseudo: pseudo });
                await setDoc(doc(db, "pseudos", pseudo), { uid: res.user.uid });
                alert("Compte créé !");
            } catch (err) { alert(err.message); }
        }

        window.login = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (err) { alert("Erreur de connexion"); }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                currentUserPseudo = userSnap.data().pseudo;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        // --- MESSAGES & IMAGES ---
        const input = document.getElementById('chat-input');
        input.addEventListener('keypress', async (e) => {
            if(e.key === 'Enter' && input.value) {
                const text = input.value;
                input.value = '';
                await addDoc(collection(db, "messages"), {
                    user: currentUserPseudo,
                    text: text,
                    createdAt: serverTimestamp()
                });
            }
        });

        document.getElementById('img-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const storageRef = ref(storage, 'chats/' + Date.now() + "_" + file.name);
            const snapshot = await uploadBytes(storageRef, file);
            const url = await getDownloadURL(snapshot.ref);
            
            await addDoc(collection(db, "messages"), {
                user: currentUserPseudo,
                text: "",
                image: url,
                createdAt: serverTimestamp()
            });
        });

        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const flow = document.getElementById('msg-flow');
                flow.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'msg';
                    div.innerHTML = `
                        <div class="avatar">${data.user[0].toUpperCase()}</div>
                        <div class="msg-content">
                            <span class="msg-user">${data.user}</span>
                            <div class="msg-text">
                                ${data.text}
                                ${data.image ? `<img src="${data.image}">` : ''}
                            </div>
                        </div>
                    `;
                    flow.appendChild(div);
                });
                flow.scrollTop = flow.scrollHeight;
            });
        }
    </script>
</body>
</html>
