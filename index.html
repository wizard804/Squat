<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squat | Général</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-channels: #2B2D31;
            --bg-chat: #313338;
            --bg-members: #2B2D31;
            --bg-input: #383A40;
            --text-main: #DBDEE1;
            --text-muted: #949BA4;
            --blurple: #5865F2;
            --header-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-chat); color: white; overflow: hidden; 
        }

        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* 1. Colonne de Gauche (Le Salon Unique) */
        .sidebar-channels {
            width: 240px; background: var(--bg-channels);
            display: flex; flex-direction: column; flex-shrink: 0;
        }

        .header-box {
            height: 48px; padding: 0 16px; display: flex; align-items: center;
            font-weight: bold; font-size: 15px; box-shadow: var(--header-shadow);
            z-index: 2;
        }

        .channel-list { padding: 20px 8px; flex-grow: 1; }
        
        .channel-active {
            background: #3F4147; color: white;
            padding: 8px 12px; border-radius: 4px;
            display: flex; align-items: center; cursor: default;
        }

        /* 2. Zone de Chat (Milieu) */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; }

        .chat-messages {
            flex-grow: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 18px;
        }

        /* Style des messages */
        .message { display: flex; gap: 16px; }
        .avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            background: var(--blurple); display: flex; align-items: center; 
            justify-content: center; font-weight: bold; flex-shrink: 0;
        }
        .msg-content { display: flex; flex-direction: column; }
        .msg-user { color: white; font-weight: 600; font-size: 15px; margin-bottom: 2px; }
        .msg-text { color: var(--text-main); font-size: 15px; line-height: 1.4; word-break: break-word; }

        /* Input Zone */
        .input-container { padding: 0 20px 24px; }
        .input-wrapper {
            background: var(--bg-input); border-radius: 8px;
            padding: 10px 16px; display: flex; align-items: center;
        }
        #chat-input {
            background: transparent; border: none; color: white;
            width: 100%; outline: none; font-size: 15px;
        }

        /* 3. Colonne de Droite (Membres) */
        .sidebar-members {
            width: 240px; background: var(--bg-members);
            padding: 20px 16px; flex-shrink: 0;
        }
        .member-title {
            color: var(--text-muted); font-size: 12px; font-weight: bold;
            text-transform: uppercase; margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar-channels">
        <div class="header-box">🏠 Squat</div>
        <div class="channel-list">
            <div class="channel-active">
                <i class="fa-solid fa-hashtag" style="margin-right: 8px; color: var(--text-muted);"></i>
                général
            </div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="header-box">
            <i class="fa-solid fa-hashtag" style="color: var(--text-muted); margin-right: 10px;"></i>
            général
        </div>

        <div class="chat-messages" id="output">
            <div class="message">
                <div class="avatar" style="background: #23a559">S</div>
                <div class="msg-content">
                    <span class="msg-user">Système Squat</span>
                    <span class="msg-text">Bienvenue dans le salon général. Tout le monde te voit ici !</span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <form id="chat-form" class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Envoyer un message dans #général" autocomplete="off">
            </form>
        </div>
    </main>

    <aside class="sidebar-members">
        <div class="member-title">Membres — 1</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="avatar" style="width: 32px; height: 32px; font-size: 12px;">TOI</div>
            <span id="my-name-display" style="color: var(--text-main); font-size: 14px;">Anonyme</span>
        </div>
    </aside>
</div>

<script>
    // --- CONNEXION SUPABASE ---
    // Remplace par tes clés Supabase pour que tes potes puissent vraiment voir tes messages
    const SUPABASE_URL = 'https://TON_PROJET.supabase.co';
    const SUPABASE_KEY = 'TA_CLE_PUBLIQUE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const output = document.getElementById('output');
    
    // Demander le pseudo et l'afficher à droite
    const pseudo = prompt("Choisis ton blaze pour Squatter :") || "Anonyme";
    document.getElementById('my-name-display').innerText = pseudo;

    // Afficher un message
    function renderMessage(user, text) {
        const div = document.createElement('div');
        div.className = 'message';
        div.innerHTML = `
            <div class="avatar">${user.charAt(0).toUpperCase()}</div>
            <div class="msg-content">
                <span class="msg-user">${user}</span>
                <span class="msg-text">${text}</span>
            </div>
        `;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
    }

    // Envoyer un message
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (input.value.trim()) {
            const message = input.value;
            input.value = '';

            // Envoyer à Supabase (Table : messages / Colonnes : username, content)
            await supabase.from('messages').insert([{ username: pseudo, content: message }]);
        }
    });

    // Écouter les nouveaux messages des autres en direct
    supabase
        .channel('room1')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            renderMessage(payload.new.username, payload.new.content);
        })
        .subscribe();
</script>

</body>
</html>
