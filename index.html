<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squat | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #000000;
            --bg-sidebar: #09090A;
            --bg-input: #111214;
            --blurple: #5865F2;
            --text-main: #FFFFFF;
            --text-muted: #80848E;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-black); color: white; overflow: hidden; }

        /* --- Écrans de Connexion --- */
        #auth-screen { position: fixed; inset: 0; z-index: 999; background: var(--bg-black); display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #0F0F11; padding: 40px; border-radius: 12px; width: 360px; text-align: center; border: 1px solid #1e1f22; }
        .auth-card input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #1e1f22; background: #000; color: white; box-sizing: border-box; outline: none; }
        .auth-card button { width: 100%; padding: 12px; background: var(--blurple); border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .auth-link { color: var(--blurple); cursor: pointer; font-size: 13px; display: block; margin-top: 20px; }

        /* --- Interface Principale --- */
        #main-app { display: none; height: 100vh; width: 100vw; }
        .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid #1e1f22; display: flex; flex-direction: column; }
        .chat-view { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg-black); }
        .header { height: 48px; border-bottom: 1px solid #1e1f22; display: flex; align-items: center; padding: 0 16px; font-weight: bold; }
        
        .messages-list { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { display: flex; gap: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--blurple); display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .msg-author { font-weight: bold; font-size: 15px; margin-right: 8px; }
        .msg-time { font-size: 11px; color: var(--text-muted); }
        .msg-text { color: var(--text-main); margin-top: 4px; word-break: break-word; }
        .msg-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 10px; border: 1px solid #333; }

        .input-area { padding: 0 20px 24px; }
        .input-bar { background: var(--bg-input); padding: 10px 16px; border-radius: 8px; display: flex; align-items: center; gap: 15px; }
        #chat-input { background: transparent; border: none; color: white; flex-grow: 1; outline: none; }
        .plus-btn { color: var(--text-muted); cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card" id="login-box">
            <h2>Bon retour !</h2>
            <input type="email" id="l-email" placeholder="E-mail">
            <input type="password" id="l-pass" placeholder="Mot de passe">
            <button id="btn-login">Se connecter</button>
            <span class="auth-link" id="link-to-reg">Besoin d'un compte ? S'inscrire</span>
        </div>
        <div class="auth-card" id="reg-box" style="display:none;">
            <h2>Créer un compte</h2>
            <input type="text" id="r-pseudo" placeholder="Pseudo (unique)">
            <input type="email" id="r-email" placeholder="E-mail">
            <input type="password" id="r-pass" placeholder="Mot de passe">
            <button id="btn-reg">S'inscrire</button>
            <span class="auth-link" id="link-to-login">Déjà un compte ?</span>
        </div>
    </div>

    <div id="main-app">
        <aside class="sidebar">
            <div class="header">🏠 Squat</div>
            <div style="padding: 20px 10px 10px; font-size: 11px; color: var(--text-muted); font-weight: bold;">SALONS TEXTUELS</div>
            <div style="padding: 8px 12px; background: #ffffff11; margin: 0 8px; border-radius: 4px;"><i class="fa-solid fa-hashtag"></i> général</div>
        </aside>
        <main class="chat-view">
            <div class="header"># général</div>
            <div class="messages-list" id="msg-container"></div>
            <div class="input-area">
                <form id="chat-form" class="input-bar">
                    <label for="img-file" class="plus-btn"><i class="fa-solid fa-circle-plus"></i></label>
                    <input type="file" id="img-file" hidden accept="image/*">
                    <input type="text" id="chat-input" placeholder="Envoyer un message dans #général" autocomplete="off">
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxTEoyx7uwDy1Hwhloa1wCVpYa5lJ4_9I",
            authDomain: "squat-277ee.firebaseapp.com",
            databaseURL: "https://squat-277ee-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "squat-277ee",
            storageBucket: "squat-277ee.firebasestorage.app",
            messagingSenderId: "646360838023",
            appId: "1:646360838023:web:4fc76054717fed4b93ed22"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let myPseudo = "";

        // Gestion des écrans
        document.getElementById('link-to-reg').onclick = () => { document.getElementById('login-box').style.display = 'none'; document.getElementById('reg-box').style.display = 'block'; };
        document.getElementById('link-to-login').onclick = () => { document.getElementById('login-box').style.display = 'block'; document.getElementById('reg-box').style.display = 'none'; };

        // INSCRIPTION
        document.getElementById('btn-reg').onclick = async () => {
            const email = document.getElementById('r-email').value;
            const pass = document.getElementById('r-pass').value;
            const pseudo = document.getElementById('r-pseudo').value.trim().toLowerCase();

            if(!pseudo || !email || !pass) return alert("Remplis tout !");
            
            try {
                const check = await getDoc(doc(db, "pseudos", pseudo));
                if(check.exists()) return alert("Pseudo déjà pris !");

                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), { pseudo: pseudo });
                await setDoc(doc(db, "pseudos", pseudo), { uid: res.user.uid });
            } catch (e) { alert(e.message); }
        };

        // CONNEXION
        document.getElementById('btn-login').onclick = async () => {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("Erreur : " + e.message); }
        };

        // Surveillance de l'état connecté
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if(snap.exists()) {
                    myPseudo = snap.data().pseudo;
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    listenMsgs();
                }
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        // Envoi Message
        const chatForm = document.getElementById('chat-form');
        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            const val = input.value;
            input.value = "";
            await addDoc(collection(db, "messages"), { author: myPseudo, content: val, type: 'text', time: serverTimestamp() });
        };

        // Envoi Image
        document.getElementById('img-file').onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const sRef = ref(storage, `chats/${Date.now()}_${file.name}`);
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);
            await addDoc(collection(db, "messages"), { author: myPseudo, content: url, type: 'image', time: serverTimestamp() });
        };

        function listenMsgs() {
            const q = query(collection(db, "messages"), orderBy("time", "asc"));
            onSnapshot(q, (snap) => {
                const cont = document.getElementById('msg-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    const date = m.time ? new Date(m.time.seconds*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : "...";
                    const div = document.createElement('div');
                    div.className = 'msg';
                    div.innerHTML = `
                        <div class="avatar">${m.author[0].toUpperCase()}</div>
                        <div class="msg-content">
                            <div class="msg-info"><span class="msg-author">${m.author}</span><span class="msg-time">${date}</span></div>
                            <div class="msg-text">${m.type === 'text' ? m.content : `<img src="${m.content}" class="msg-img">`}</div>
                        </div>
                    `;
                    cont.appendChild(div);
                });
                cont.scrollTop = cont.scrollHeight;
            });
        }
    </script>
</body>
</html>
